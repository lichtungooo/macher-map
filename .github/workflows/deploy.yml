name: Build and Push

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Macher-Map (dieses Repo) — checken in Subdir damit Sibling-Repos daneben passen
      - name: Checkout macher-map
        uses: actions/checkout@v4
        with:
          path: macher-map

      # Real-Life-Stack (Antons Toolkit) — auf bekannt-guten Commit gepinned.
      # Antons aktueller master enthaelt einen Refactor (@real-life/wot-core)
      # der noch nicht mit web-of-trust synchronisiert ist. Wir bleiben bis
      # zur Abstimmung mit Anton auf b046e96 (zuletzt gruener Build).
      # fetch-depth: 0 noetig damit ein nicht-HEAD Commit erreichbar ist.
      - name: Checkout real-life-stack
        uses: actions/checkout@v4
        with:
          repository: real-life-org/real-life-stack
          ref: b046e96afa68cbc4f4ad62c7ddef1a3e3019727f
          path: real-life-stack
          fetch-depth: 0

      # Web-of-Trust (Antons Identitaets-Stack) — pinned auf lokal bewaehrten Stand
      - name: Checkout web-of-trust
        uses: actions/checkout@v4
        with:
          repository: antontranelis/web-of-trust
          ref: b970f51963002a34ad8065a04da8b1619ebc2369
          path: web-of-trust
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          # Build-Context = Parent-Verzeichnis mit allen drei Repos
          context: .
          file: ./macher-map/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
