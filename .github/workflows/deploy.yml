name: Build and Push

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Macher-Map (dieses Repo) — checken in Subdir damit Sibling-Repos daneben passen
      - name: Checkout macher-map
        uses: actions/checkout@v4
        with:
          path: macher-map

      # Real-Life-Stack (Antons Toolkit) — gleicher Parent-Pfad
      - name: Checkout real-life-stack
        uses: actions/checkout@v4
        with:
          repository: real-life-org/real-life-stack
          ref: master
          path: real-life-stack

      # Web-of-Trust (Antons Identitaets-Stack)
      - name: Checkout web-of-trust
        uses: actions/checkout@v4
        with:
          repository: antontranelis/web-of-trust
          ref: main
          path: web-of-trust

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          # Build-Context = Parent-Verzeichnis mit allen drei Repos
          context: .
          file: ./macher-map/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
